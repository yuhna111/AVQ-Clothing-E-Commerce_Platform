spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/avq_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate.ddl-auto: none            # schema do Flyway tạo (V1, V2); không để Hibernate sửa CSDL
    open-in-view: false
    properties.hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo   # db/demo = V3 dữ liệu mẫu cho buổi demo
  jackson:
    time-zone: Asia/Ho_Chi_Minh
server.port: 8080
jwt.secret: ${JWT_SECRET:avq-clothing-demo-secret-key-2026!!}
ai.base-url: ${AI_BASE_URL:http://localhost:8000}      # không có AI Service -> tự dùng bảng size (FB-01)
payment.provider: ${PAYMENT_PROVIDER:mock}               # mock = cổng giả lập; vnpay = VNPay sandbox
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:AVQTEST1}
  hash-secret: ${VNPAY_HASH_SECRET:SECRETKEY-SANDBOX}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/thanh-toan/ket-qua}
